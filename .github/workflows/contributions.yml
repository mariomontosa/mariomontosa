name: Update contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/contributions.yml"
      - "scripts/render_contributions.py"

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render real GitHub contributions
        run: python scripts/render_contributions.py

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- assets/github-activity.svg; then
            echo "Contribution calendar is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          git commit -m "chore: update contribution calendar"
          git push
