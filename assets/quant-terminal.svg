<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Nezus Quant Dashboard Overview</title>
<desc id="desc">Animated overview of the Nezus quantitative trading dashboard with portfolio metrics, equity curve and open positions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060B12"/><stop offset=".55" stop-color="#09111D"/><stop offset="1" stop-color="#050A10"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0E1825"/><stop offset="1" stop-color="#09121D"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#14B8A6"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#14B8A6" stop-opacity=".28"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="chartClip"><rect x="263" y="277" width="515" height="166" rx="8"/></clipPath>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:JetBrains Mono,Consolas,monospace}
    .muted{fill:#738095}.label{fill:#91A0B5}.bright{fill:#EEF5FA}.teal{fill:#2DD4BF}.green{fill:#4ADE80}
    .pulse{animation:pulse 2.2s ease-in-out infinite;transform-origin:center}
    .trace{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4.5s ease-in-out infinite}
    .fade{animation:fade 4.5s ease-in-out infinite}
    .bar1{animation:b1 3.2s ease-in-out infinite;transform-origin:812px 337px}
    .bar2{animation:b2 3.2s .25s ease-in-out infinite;transform-origin:840px 337px}
    .bar3{animation:b3 3.2s .5s ease-in-out infinite;transform-origin:868px 337px}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.72)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes draw{0%{stroke-dashoffset:900}45%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
    @keyframes fade{0%,8%,100%{opacity:0}25%,78%{opacity:1}}
    @keyframes b1{0%,100%{transform:scaleY(.58)}50%{transform:scaleY(1)}}@keyframes b2{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(.48)}}@keyframes b3{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(.9)}}
  </style>
</defs>

