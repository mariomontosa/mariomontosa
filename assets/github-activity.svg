<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img" aria-labelledby="title desc">
  <title id="title">Mario Montosa — GitHub activity</title>
  <desc id="desc">A repository-hosted card linking to Mario Montosa's GitHub contribution calendar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="918" height="208" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <circle cx="70" cy="70" r="28" fill="#161b22" stroke="#38bdf8" stroke-width="2"/>
  <path d="M58 70l9 9 17-20" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="61" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">GitHub Contribution Activity</text>
  <text x="118" y="91" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="16">@mariomontosa · quantitative research &amp; engineering</text>
  <path d="M55 151 C135 105 185 178 265 133 S405 165 485 118 S625 162 705 111 S815 124 866 81" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#f0f6fc" stroke="#1f6feb" stroke-width="3">
    <circle cx="55" cy="151" r="5"/><circle cx="265" cy="133" r="5"/><circle cx="485" cy="118" r="5"/><circle cx="705" cy="111" r="5"/><circle cx="866" cy="81" r="5"/>
  </g>
  <text x="55" y="190" fill="#58a6ff" font-family="Segoe UI,Arial,sans-serif" font-size="14">Open the live contribution calendar on GitHub →</text>
</svg>